# Approve postinstall scripts for trusted tooling:
# - lefthook: installs git hooks (self-skips when CI env is set)
# - unrs-resolver: verifies its napi prebuilt binding (used via eslint)
allowBuilds:
  lefthook: true
  unrs-resolver: true

# pnpm settings (read even though this is not a workspace).

# pnpm 11 defaults minimumReleaseAge to 1440 (24h), which rejects installing
# dependency versions published within the last 24 hours. This repo merges
# Renovate updates shortly after upstream release (e.g. next@16.3.3), so the
# default would fail `pnpm install --frozen-lockfile` in CI/Docker for up to
# 24h after such merges. Set to 0 to keep the same behavior we had with yarn.
# To opt into supply-chain hardening later, raise this (e.g. 1440).
minimumReleaseAge: 0

# TypeScript 7 has no JS compiler API yet. Route typescript-eslint through the
# TS 6 compatibility package while the root typescript package supplies TS 7.
overrides:
  "@typescript-eslint/eslint-plugin>typescript": npm:@typescript/typescript6@6.0.2
  "@typescript-eslint/parser>typescript": npm:@typescript/typescript6@6.0.2
  "@typescript-eslint/project-service>typescript": npm:@typescript/typescript6@6.0.2
  "@typescript-eslint/tsconfig-utils>typescript": npm:@typescript/typescript6@6.0.2
  "@typescript-eslint/type-utils>typescript": npm:@typescript/typescript6@6.0.2
  "@typescript-eslint/typescript-estree>typescript": npm:@typescript/typescript6@6.0.2
  "@typescript-eslint/utils>typescript": npm:@typescript/typescript6@6.0.2
  "ts-api-utils>typescript": npm:@typescript/typescript6@6.0.2
  "typescript-eslint>typescript": npm:@typescript/typescript6@6.0.2
