# Local-only overrides for Ghost development.
# NEVER auto-loaded by Dokploy (composePath points at docker-compose.yml only).
# Usage:
#   docker compose -f ghost/docker-compose.yml -f ghost/docker-compose.local.yml up -d
#   docker compose -f ghost/docker-compose.yml -f ghost/docker-compose.local.yml down
# Data persists in local volumes (`ghost_ghost`, `ghost_db`); `down -v` wipes it.
# Volumes are local to this machine — prod volumes live on the VPS, so prod
# content is never touched. Ghost admin: http://localhost:2368/ghost
services:
  ghost:
    ports:
      - "127.0.0.1:2368:2368"
    environment:
      url: http://localhost:2368
    # Local-only Ghost config: disables staff new-device email verification
    # (no mail server locally). Real boolean via file mount — env strings
    # would stay truthy. Prod keeps verification ON; this file never
    # touches prod (Dokploy only loads docker-compose.yml).
    volumes:
      - ./config.local.json:/var/lib/ghost/config.production.json:ro
