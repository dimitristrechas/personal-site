services:
  ghost:
    image: ghost:6.73
    restart: always
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      database__connection__database: ghost
      url: https://ghost.dimitristrechas.com
      # Staff new-device verification emails cannot be delivered (no SMTP;
      # Direct is blocked from the VPS), which locks out admin logins.
      # Ghost checks `config !== true`, so any string value disables it.
      # Re-enable (remove this) once real SMTP is configured. Local dev
      # disables it separately via ghost/config.local.json.
      security__staffDeviceVerification: "false"
    volumes:
      - ghost:/var/lib/ghost/content
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ghost
    volumes:
      - db:/var/lib/mysql

volumes:
  ghost:
  db:
