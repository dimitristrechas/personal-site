# Self-hosted Renovate via GitHub Actions.
#
# Setup (one-time):
# 1. Create a classic PAT with `repo` and `workflow` scopes.
# 2. Add it as repository secret RENOVATE_TOKEN.
# 3. Enable "Allow GitHub Actions to create and approve pull requests"
#    in repository Settings → Actions → General.

name: Renovate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Renovate config
        run: jq type renovate.json

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
